<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكتبة أجمل الهدايا</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f5f6fb;color:#172033}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.hide{display:none!important}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#171225,#6948dc)}
.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 60px #0003;width:min(430px,100%)}.logo{width:85px;height:85px;object-fit:cover;border-radius:22px;display:block;margin:auto}.center{text-align:center}.tabs{display:flex;gap:5px;background:#eeeef5;padding:4px;border-radius:12px;margin:18px 0}.tabs button{flex:1;padding:11px;border-radius:9px;background:transparent}.tabs .on{background:#fff;font-weight:bold}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px}.primary{background:#6948dc;color:#fff;padding:13px;border-radius:12px;font-weight:bold;width:100%}.secondary{background:#eeeef5;padding:10px 14px;border-radius:11px}.danger{background:#ffe5e8;color:#b32032;padding:9px 12px;border-radius:10px}.ok{background:#e1f8ed;color:#087b55;padding:9px 12px;border-radius:10px}
#app{display:none}.top{height:64px;background:#fff;border-bottom:1px solid #e7e8ef;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;position:sticky;top:0;z-index:5}.top img{width:42px;height:42px;border-radius:12px;object-fit:cover;vertical-align:middle}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}aside{background:#fff;border-left:1px solid #e7e8ef;padding:12px}.nav button{display:block;width:100%;text-align:right;padding:12px;margin:5px 0;background:transparent;border-radius:11px;color:#5b6575}.nav button:hover,.nav .active{background:#eeeaff;color:#5839d7;font-weight:bold}main{padding:18px;max-width:1450px;width:100%;margin:auto}.welcome{background:linear-gradient(135deg,#6948dc,#9b7aff);color:white;border-radius:22px;padding:22px;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:#fff;border:1px solid #e8e9f0;border-radius:18px;padding:16px;box-shadow:0 10px 30px #18234a0a}.stat b{font-size:24px;display:block;margin-top:7px}.panel{margin-top:15px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pos{display:grid;grid-template-columns:1.4fr .9fr;gap:15px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.prod{border:1px solid #e8e9f0;border-radius:15px;padding:12px}.prod button{width:100%;margin-top:8px;padding:9px;border-radius:9px;background:#eeeaff;color:#5839d7}.cart{border-top:1px solid #eee;margin-top:10px}.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.total{background:#f5f3ff;padding:12px;border-radius:12px;margin:10px 0}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}th{color:#697386;font-size:12px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px;z-index:20}.modal>div{background:#fff;border-radius:20px;padding:20px;width:min(650px,100%);max-height:90vh;overflow:auto}.close{float:left;border-radius:50%;width:32px;height:32px}.bottom{display:none}.toast{position:fixed;bottom:20px;left:20px;background:#172033;color:#fff;padding:12px 16px;border-radius:12px;z-index:99}
@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:none}.stats{grid-template-columns:1fr 1fr}.pos{grid-template-columns:1fr}.products{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;z-index:10}.bottom button{flex:1;padding:9px;background:transparent;font-size:11px}main{padding:12px 12px 75px}}
@media print{.top,aside,.bottom,.noPrint{display:none!important}.invoice{box-shadow:none!important;border:0!important}}
</style>
</head>
<body>
<section id="auth">
<div class="card">
<img src="logo.jpg" class="logo" onerror="this.style.display='none'">
<h2 class="center">مكتبة أجمل الهدايا</h2><p class="center">نظام الكاشير والحسابات والمخزون</p>
<div class="tabs"><button id="lt" class="on" onclick="mode('login')">دخول</button><button id="rt" onclick="mode('reg')">إنشاء حساب</button></div>
<form id="login"><div class="field"><label>البريد</label><input id="le" type="email" required></div><div class="field"><label>كلمة المرور</label><input id="lp" type="password" required></div><button class="primary">دخول</button></form>
<form id="reg" class="hide"><div class="field"><label>الاسم</label><input id="rn" required></div><div class="field"><label>الهاتف</label><input id="rp"></div><div class="field"><label>البريد</label><input id="re" type="email" required></div><div class="field"><label>كلمة المرور</label><input id="rpass" type="password" minlength="6" required></div><button class="primary">إنشاء الحساب</button><p class="center" style="font-size:12px;color:#777">أول حساب يتم إنشاؤه هو حساب المالك الأول. بعد ذلك الحسابات الجديدة تحتاج موافقة المالك.</p></form>
<p id="msg" class="center"></p>
</div></section>

<div id="app">
<header class="top"><div><img src="logo.jpg" onerror="this.style.display='none'"> <b>مكتبة أجمل الهدايا</b></div><div><span id="who"></span> <button class="secondary" onclick="logout()">خروج</button></div></header>
<div class="layout"><aside><div id="nav" class="nav"></div></aside><main id="main"></main></div><div id="bottom" class="bottom"></div>
</div>
<div id="modal" class="modal hide"><div id="mb"></div></div><div id="toast" class="toast hide"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,addDoc,setDoc,updateDoc,query,orderBy,limit,where,runTransaction,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyDaYNjnxEmJ-FgRvOQmH1ShofQ-AlrT2EU",authDomain:"agmal-el-hdaya-dcbb2.firebaseapp.com",projectId:"agmal-el-hdaya-dcbb2",storageBucket:"agmal-el-hdaya-dcbb2.firebasestorage.app",messagingSenderId:"466997940122",appId:"1:466997940122:web:cabc7a6736055039cf7423",measurementId:"G-H5YJ6RVCMR"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
let user=null,me=null,products=[],cart=[],page="home";
const pages=[["home","🏠 الرئيسية"],["pos","🧾 الكاشير"],["accounts","💰 الحسابات"],["invoices","📄 الفواتير"],["products","📦 المنتجات"],["orders","🛒 الطلبات"],["reports","📊 التقارير"],["approvals","✅ الموافقات"]];
const $=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),money=x=>Number(x||0).toLocaleString("ar-EG",{style:"currency",currency:"EGP"}),dt=x=>x?.toDate?x.toDate().toLocaleString("ar-EG"):x?new Date(x).toLocaleString("ar-EG"):"-";
function toast(x){$("toast").textContent=x;$("toast").classList.remove("hide");setTimeout(()=>$("toast").classList.add("hide"),2500)}
function mode(x){$("login").classList.toggle("hide",x!="login");$("reg").classList.toggle("hide",x!="reg");$("lt").classList.toggle("on",x=="login");$("rt").classList.toggle("on",x=="reg");$("msg").textContent=""}
$("login").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$("le").value,$("lp").value)}catch(x){$("msg").textContent="بيانات الدخول غير صحيحة أو الحساب غير متاح."}}
$("reg").onsubmit=async e=>{e.preventDefault();try{let c=await createUserWithEmailAndPassword(auth,$("re").value,$("rpass").value),s=await getDocs(query(collection(db,"users"),limit(1))),first=s.empty;await setDoc(doc(db,"users",c.user.uid),{uid:c.user.uid,name:$("rn").value,phone:$("rp").value,email:$("re").value,role:first?"owner":"employee",status:first?"approved":"pending",createdAt:serverTimestamp()});$("msg").textContent=first?"تم إنشاء حساب المالك.":"تم إنشاء الحساب، في انتظار موافقة المالك."}catch(x){$("msg").textContent=x.message}}
window.logout=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{user=u;if(!u){$("auth").style.display="grid";$("app").style.display="none";return}let s=await getDoc(doc(db,"users",u.uid));if(!s.exists()||s.data().status!="approved"){await signOut(auth);$("msg").textContent="الحساب في انتظار موافقة المالك.";return}me=s.data();$("auth").style.display="none";$("app").style.display="block";$("who").textContent=(me.role=="owner"?"👑 ":"👤 ")+me.name;nav();loadProducts();go("home")});
function nav(){let p=pages.filter(x=>x[0]!="approvals"||me.role=="owner");$("nav").innerHTML=p.map(x=>`<button data-p="${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join("");$("bottom").innerHTML=p.slice(0,5).map(x=>`<button onclick="go('${x[0]}')">${x[1].split(" ")[0]}<br>${x[1].slice(2)}</button>`).join("")}
window.go=async p=>{page=p;document.querySelectorAll("[data-p]").forEach(x=>x.classList.toggle("active",x.dataset.p==p));if(p=="home")home();if(p=="pos")pos();if(p=="accounts")accounts();if(p=="invoices")invoices();if(p=="products")productPage();if(p=="orders")orders();if(p=="reports")reports();if(p=="approvals")approvals()};
async function loadProducts(){let s=await getDocs(collection(db,"products"));products=s.docs.map(x=>({id:x.id,...x.data()}))}
function home(){$("main").innerHTML=`<div class="welcome"><h2>مرحبًا يا بشمهندس يوسف 👋</h2><p>مكتبة أجمل الهدايا — البيانات محفوظة على Firebase.</p></div><div class="stats"><div class="stat">المنتجات<b>${products.length}</b></div><div class="stat">الوحدات<b>${products.reduce((a,x)=>a+Number(x.stock||0),0)}</b></div><div class="stat">مخزون منخفض<b>${products.filter(x=>Number(x.stock||0)<=Number(x.minStock||3)).length}</b></div><div class="stat">الصلاحية<b>${me.role=="owner"?"مالك":"موظف"}</b></div></div><div class="panel"><div class="grid"><button class="primary" onclick="go('pos')">فتح الكاشير</button><button class="secondary" onclick="go('accounts')">الحسابات</button><button class="secondary" onclick="go('products')">المخزون</button></div></div>`}
async function pos(){await loadProducts();let a=await getDocs(collection(db,"accounts"));$("main").innerHTML=`<div class="pos"><div class="panel"><div class="head"><h2>🧾 الكاشير</h2><input id="search" placeholder="بحث..." oninput="filter()"></div><div id="pg" class="products"></div></div><div class="panel"><h2>الفاتورة</h2><div id="cart" class="cart"></div><div class="field"><label>الحساب</label><select id="acc"><option value="">نقدي</option>${a.docs.map(d=>`<option value="${d.id}">${esc(d.data().name)}</option>`).join("")}</select></div><div class="field"><label>طريقة الدفع</label><select id="method"><option>نقدي</option><option>بطاقة</option><option>تحويل</option><option>آجل</option></select></div><div class="field"><label>الخصم</label><input id="disc" type="number" value="0" oninput="cartView()"></div><div class="field"><label>المدفوع</label><input id="paid" type="number" value="0" oninput="cartView()"></div><div id="sum"></div><button class="primary" onclick="invoice()">حفظ الفاتورة</button></div></div>`;filter();cartView()}
window.filter=()=>{let q=($("search")?.value||"").toLowerCase();$("pg").innerHTML=products.filter(p=>(p.name||"").toLowerCase().includes(q)).map(p=>`<div class="prod"><b>${esc(p.name)}</b><div>${money(p.price)} • المخزون ${p.stock??0}</div><button onclick="add('${p.id}')">إضافة</button></div>`).join("")}
window.add=id=>{let p=products.find(x=>x.id==id);if(!p||p.stock<=0)return toast("المنتج غير متوفر");let x=cart.find(x=>x.id==id);x?x.qty++:cart.push({id:p.id,name:p.name,price:Number(p.price),qty:1});cartView()}
window.qty=(id,n)=>{let x=cart.find(x=>x.id==id);x.qty+=n;if(x.qty<1)cart=cart.filter(y=>y.id!=id);cartView()}
window.cartView=()=>{let sub=cart.reduce((a,x)=>a+x.price*x.qty,0),d=Number($("disc")?.value||0),total=Math.max(0,sub-d),paid=Number($("paid")?.value||0);$("cart").innerHTML=cart.map(x=>`<div class="item"><span>${esc(x.name)}<br><small>${money(x.price)} × ${x.qty}</small></span><span><button class="secondary" onclick="qty('${x.id}',-1)">−</button> ${x.qty} <button class="secondary" onclick="qty('${x.id}',1)">+</button></span></div>`).join("")||"<p>الفاتورة فارغة</p>";$("sum").innerHTML=`<div class="total">الإجمالي: <b>${money(sub)}</b><br>الخصم: <b>${money(d)}</b><br>الصافي: <b>${money(total)}</b><br>المتبقي: <b>${money(Math.max(0,total-paid))}</b></div>`}
window.invoice=async()=>{if(!cart.length)return toast("أضف منتجًا");let sub=cart.reduce((a,x)=>a+x.price*x.qty,0),d=Number($("disc").value||0),total=Math.max(0,sub-d),paid=Number($("paid").value||0),rem=total-paid;if(paid>total)return toast("المدفوع أكبر من الفاتورة");if($("method").value=="آجل"&&!$("acc").value)return toast("اختر الحساب");let data={number:"INV-"+Date.now(),items:cart,subtotal:sub,discount:d,total,paid,remaining:rem,paymentMethod:$("method").value,accountId:$("acc").value||null,createdByUid:user.uid,createdByName:me.name,createdAt:serverTimestamp()};try{let ref=await addDoc(collection(db,"invoices"),data);for(let x of cart){let r=doc(db,"products",x.id);await runTransaction(db,async t=>{let s=await t.get(r),n=Number(s.data().stock||0)-x.qty;if(n<0)throw Error("المخزون لا يكفي");t.update(r,{stock:n,updatedAt:serverTimestamp()})})}if($("acc").value&&rem>0){let r=doc(db,"accounts",$("acc").value);await runTransaction(db,async t=>{let s=await t.get(r);t.update(r,{balance:Number(s.data().balance||0)+rem,updatedAt:serverTimestamp()})});await addDoc(collection(db,"accounts",$("acc").value,"transactions"),{type:"invoice",invoiceId:ref.id,amount:rem,createdByUid:user.uid,createdByName:me.name,createdAt:serverTimestamp()})}cart=[];await loadProducts();showInvoice({id:ref.id,...data,createdAt:new Date()})}catch(e){toast(e.message)}}
function showInvoice(x){$("main").innerHTML=`<div class="panel noPrint"><button class="primary" onclick="print()">🖨️ طباعة الفاتورة</button></div><div class="panel invoice"><div class="head"><div><img src="logo.jpg" style="width:60px;height:60px;object-fit:cover;border-radius:12px"><h2>مكتبة أجمل الهدايا</h2><div>01014953007</div></div><div>فاتورة: <b>${esc(x.number)}</b><br>${dt(x.createdAt)}<br>الكاشير: ${esc(x.createdByName)}</div></div><div class="table"><table><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${x.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.price*i.qty)}</td></tr>`).join("")}</table></div><div class="total">الإجمالي ${money(x.subtotal)}<br>الخصم ${money(x.discount)}<br><b>الصافي ${money(x.total)}</b><br>المدفوع ${money(x.paid)}<br>المتبقي ${money(x.remaining)}<br>الدفع ${esc(x.paymentMethod)}</div><p class="center">شكرًا لتعاملكم مع مكتبة أجمل الهدايا ❤️</p></div>`}
async function invoices(){let s=await getDocs(query(collection(db,"invoices"),orderBy("createdAt","desc"),limit(100)));$("main").innerHTML=`<div class="panel"><div class="head"><h2>📄 الفواتير</h2><button class="secondary" onclick="go('pos')">فاتورة جديدة</button></div><div class="table"><table><tr><th>الرقم</th><th>التاريخ</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th><th>الموظف</th></tr>${s.docs.map(d=>{let x=d.data();return `<tr><td>${esc(x.number)}</td><td>${dt(x.createdAt)}</td><td>${money(x.total)}</td><td>${money(x.paid)}</td><td>${money(x.remaining)}</td><td>${esc(x.createdByName)}</td></tr>`}).join("")}</table></div></div>`}
function typeName(t){return t=="receivable"?"عليه للمكتبة":t=="credit"?"له رصيد عند المكتبة":"المكتبة عليها"}
async function accounts(){let s=await getDocs(collection(db,"accounts"));$("main").innerHTML=`<div class="panel"><div class="head"><h2>💰 الحسابات</h2><button class="secondary" onclick="newAccount()">+ حساب</button></div><div class="table"><table><tr><th>الاسم</th><th>النوع</th><th>الهاتف</th><th>الرصيد</th><th></th></tr>${s.docs.map(d=>{let x=d.data();return `<tr><td>${esc(x.name)}</td><td>${typeName(x.type)}</td><td>${esc(x.phone||"-")}</td><td>${money(x.balance)}</td><td><button class="secondary" onclick="statement('${d.id}')">كشف الحساب</button></td></tr>`}).join("")}</table></div></div>`}
window.newAccount=()=>modal(`<h3>حساب جديد</h3><div class="field"><label>الاسم</label><input id="an"></div><div class="field"><label>الهاتف</label><input id="aph"></div><div class="field"><label>النوع</label><select id="at"><option value="receivable">عليه للمكتبة</option><option value="credit">له رصيد عند المكتبة</option><option value="library_owes">المكتبة عليها</option></select></div><button class="primary" onclick="saveAccount()">حفظ</button>`);
window.saveAccount=async()=>{await addDoc(collection(db,"accounts"),{name:$("an").value,phone:$("aph").value,type:$("at").value,balance:0,createdByUid:user.uid,createdByName:me.name,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});close();accounts();toast("تم حفظ الحساب")}
window.statement=async id=>{let a=await getDoc(doc(db,"accounts",id)),s=await getDocs(query(collection(db,"accounts",id,"transactions"),orderBy("createdAt","desc")));let x=a.data();modal(`<h3>كشف حساب: ${esc(x.name)}</h3><p>الرصيد الحالي: <b>${money(x.balance)}</b></p><button class="ok" onclick="pay('${id}')">+ تسجيل دفعة</button><div class="table"><table><tr><th>التاريخ</th><th>النوع</th><th>المبلغ</th><th>الموظف</th></tr>${s.docs.map(d=>{let z=d.data();return `<tr><td>${dt(z.createdAt)}</td><td>${esc(z.type)}</td><td>${money(z.amount)}</td><td>${esc(z.createdByName)}</td></tr>`}).join("")}</table></div>`)}
window.pay=id=>modal(`<h3>تسجيل دفعة</h3><div class="field"><label>المبلغ</label><input id="pa" type="number"></div><div class="field"><label>طريقة الدفع</label><select id="pm"><option>نقدي</option><option>بطاقة</option><option>تحويل</option></select></div><div class="field"><label>ملاحظات</label><textarea id="pn"></textarea></div><button class="primary" onclick="savePay('${id}')">حفظ</button>`);
window.savePay=async id=>{let n=Number($("pa").value);if(n<=0)return toast("اكتب مبلغًا صحيحًا");let r=doc(db,"accounts",id);await runTransaction(db,async t=>{let s=await t.get(r),b=Number(s.data().balance||0);t.update(r,{balance:Math.max(0,b-n),updatedAt:serverTimestamp()})});await addDoc(collection(db,"accounts",id,"transactions"),{type:"payment",amount:n,paymentMethod:$("pm").value,note:$("pn").value,createdByUid:user.uid,createdByName:me.name,createdAt:serverTimestamp()});close();accounts();toast("تم تسجيل الدفعة")}
async function productPage(){await loadProducts();$("main").innerHTML=`<div class="panel"><div class="head"><h2>📦 المنتجات والمخزون</h2><button class="secondary" onclick="newProduct()">+ منتج</button></div><div class="table"><table><tr><th>المنتج</th><th>السعر</th><th>التكلفة</th><th>المخزون</th><th></th></tr>${products.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td>${p.stock??0}</td><td><button class="secondary" onclick="editProduct('${p.id}')">تعديل</button></td></tr>`).join("")}</table></div></div>`}
function newProduct(p={}){modal(`<h3>${p.id?"تعديل المنتج":"إضافة منتج"}</h3><div class="field"><label>الاسم</label><input id="pnm" value="${esc(p.name||"")}"></div><div class="grid"><div class="field"><label>السعر</label><input id="pp" type="number" value="${p.price??0}"></div><div class="field"><label>التكلفة</label><input id="pc" type="number" value="${p.cost??0}"></div><div class="field"><label>المخزون</label><input id="ps" type="number" value="${p.stock??0}"></div></div><button class="primary" onclick="saveProduct('${p.id||""}')">حفظ</button>`)}
window.editProduct=id=>newProduct(products.find(p=>p.id==id)||{});
window.saveProduct=async id=>{let x={name:$("pnm").value,price:Number($("pp").value),cost:Number($("pc").value),stock:Number($("ps").value),updatedAt:serverTimestamp()};id?await updateDoc(doc(db,"products",id),x):await addDoc(collection(db,"products"),{...x,createdAt:serverTimestamp(),createdByUid:user.uid});close();productPage();toast("تم حفظ المنتج")}
async function orders(){let s=await getDocs(query(collection(db,"orders"),orderBy("createdAt","desc"),limit(100)));$("main").innerHTML=`<div class="panel"><h2>🛒 الطلبات</h2><div class="table"><table><tr><th>الطلب</th><th>العميل</th><th>الإجمالي</th><th>الحالة</th><th></th></tr>${s.docs.map(d=>{let x=d.data();return `<tr><td>${d.id.slice(-8)}</td><td>${esc(x.customerName||"-")}</td><td>${money(x.total)}</td><td>${esc(x.status||"new")}</td><td><select onchange="status('${d.id}',this.value)"><option>new</option><option>confirmed</option><option>preparing</option><option>ready</option><option>delivered</option><option>cancelled</option></select></td></tr>`}).join("")}</table></div></div>`}
window.status=async(id,v)=>{await updateDoc(doc(db,"orders",id),{status:v,updatedAt:serverTimestamp(),updatedByUid:user.uid,updatedByName:me.name});toast("تم تحديث الطلب")}
async function reports(){let s=await getDocs(collection(db,"invoices")),a=0,p=0,r=0;s.forEach(d=>{let x=d.data();a+=Number(x.total||0);p+=Number(x.paid||0);r+=Number(x.remaining||0)});$("main").innerHTML=`<div class="stats"><div class="stat">المبيعات<b>${money(a)}</b></div><div class="stat">المدفوع<b>${money(p)}</b></div><div class="stat">المتبقي<b>${money(r)}</b></div><div class="stat">الفواتير<b>${s.size}</b></div></div>`}
async function approvals(){if(me.role!="owner")return;let s=await getDocs(query(collection(db,"users"),where("status","==","pending")));$("main").innerHTML=`<div class="panel"><h2>✅ موافقات الموظفين</h2><div class="table"><table><tr><th>الاسم</th><th>البريد</th><th>الهاتف</th><th></th></tr>${s.docs.map(d=>{let x=d.data();return `<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.phone||"-")}</td><td><button class="ok" onclick="approve('${d.id}')">موافقة</button></td></tr>`}).join("")||"<tr><td colspan=4>لا توجد طلبات</td></tr>"}</table></div></div>`}
window.approve=async id=>{await updateDoc(doc(db,"users",id),{status:"approved"});approvals();toast("تمت الموافقة")}
function modal(x){$("mb").innerHTML=x+`<button class="secondary" onclick="close()">إغلاق</button>`;$("modal").classList.remove("hide")}function close(){$("modal").classList.add("hide")}
</script>
</body>
</html>
