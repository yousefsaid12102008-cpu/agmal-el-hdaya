<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agmal El Hdaya</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f6f7fb;
    color:#222;
    min-height:100vh;
}

.app{
    max-width:500px;
    margin:auto;
    min-height:100vh;
    background:#f6f7fb;
    padding-bottom:90px;
}

header{
    padding:25px 20px 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.subtitle{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

.icon-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:white;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
    font-size:18px;
}

.dashboard{
    padding:10px 20px;
}

.main-card{
    background:linear-gradient(135deg,#6c5ce7,#8e7cf7);
    color:white;
    padding:25px;
    border-radius:25px;
    box-shadow:0 15px 35px rgba(108,92,231,.25);
    animation:fadeUp .6s ease;
}

.main-card small{
    opacity:.8;
}

.amount{
    font-size:34px;
    font-weight:bold;
    margin:10px 0;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:15px;
}

.stat{
    background:white;
    border-radius:20px;
    padding:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
    animation:fadeUp .7s ease;
}

.stat span{
    color:#777;
    font-size:13px;
}

.stat strong{
    display:block;
    font-size:20px;
    margin-top:8px;
}

.section{
    padding:20px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.section-title h2{
    font-size:19px;
}

.add{
    border:0;
    background:#6c5ce7;
    color:white;
    padding:10px 15px;
    border-radius:12px;
}

.customer{
    background:white;
    padding:16px;
    border-radius:18px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 5px 15px rgba(0,0,0,.04);
}

.customer-info{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:14px;
    background:#eeeaff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    color:#6c5ce7;
}

.customer-name{
    font-weight:bold;
}

.customer-phone{
    font-size:12px;
    color:#888;
    margin-top:4px;
}

.debt{
    text-align:right;
}

.debt strong{
    display:block;
    color:#e74c3c;
}

.debt small{
    color:#999;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(500px,100%);
    height:75px;
    background:white;
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 -5px 25px rgba(0,0,0,.08);
    z-index:10;
}

.nav-item{
    border:0;
    background:none;
    color:#999;
    font-size:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
}

.nav-item.active{
    color:#6c5ce7;
    font-weight:bold;
}

.fab{
    position:fixed;
    right:25px;
    bottom:95px;
    width:58px;
    height:58px;
    border:0;
    border-radius:20px;
    background:#6c5ce7;
    color:white;
    font-size:28px;
    box-shadow:0 10px 25px rgba(108,92,231,.35);
    animation:pulse 2s infinite;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.05);}
}
</style>
</head>

<body>

<div class="app">

<header>
    <div>
        <div class="logo">Agmal El Hdaya 🎁</div>
        <div class="subtitle">Debt Management</div>
    </div>

    <button class="icon-btn">🔔</button>
</header>

<div class="dashboard">

    <div class="main-card">
        <small>Total Remaining Debt</small>
        <div class="amount">12,450 EGP</div>
        <small>Across all customers</small>
    </div>

    <div class="stats">

        <div class="stat">
            <span>Total Paid</span>
            <strong>7,850 EGP</strong>
        </div>

        <div class="stat">
            <span>Customers</span>
            <strong>18</strong>
        </div>

    </div>

</div>

<div class="section">

    <div class="section-title">
        <h2>Recent Customers</h2>
        <button class="add">View All</button>
    </div>

    <div class="customer">

        <div class="customer-info">

            <div class="avatar">MA</div>

            <div>
                <div class="customer-name">Mohamed Ahmed</div>
                <div class="customer-phone">01000000000</div>
            </div>

        </div>

        <div class="debt">
            <strong>2,350 EGP</strong>
            <small>Overdue</small>
        </div>

    </div>


    <div class="customer">

        <div class="customer-info">

            <div class="avatar">AM</div>

            <div>
                <div class="customer-name">Ahmed Mohamed</div>
                <div class="customer-phone">01111111111</div>
            </div>

        </div>

        <div class="debt">
            <strong>1,500 EGP</strong>
            <small>Due Today</small>
        </div>

    </div>


    <div class="customer">

        <div class="customer-info">

            <div class="avatar">MK</div>

            <div>
                <div class="customer-name">Mahmoud Khaled</div>
                <div class="customer-phone">01222222222</div>
            </div>

        </div>

        <div class="debt">
            <strong>850 EGP</strong>
            <small>Upcoming</small>
        </div>

    </div>

</div>

<button class="fab">+</button>

<div class="bottom-nav">

    <button class="nav-item active">
        🏠
        <span>Home</span>
    </button>

    <button class="nav-item">
        👥
        <span>Customers</span>
    </button>

    <button class="nav-item">
        💰
        <span>Debts</span>
    </button>

    <button class="nav-item">
        🔔
        <span>Reminders</span>
    </button>

    <button class="nav-item">
        ⚙️
        <span>Settings</span>
    </button>

</div>

</div>

</body>
  </html>
