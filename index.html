<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5b21b6">
<title>مكتبة أجمل الهدايا - V2 Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Tajawal",sans-serif;background:#f4f5fb;color:#171717;min-height:100vh}
button{cursor:pointer;font-family:inherit}input,textarea,select{font-family:inherit}
.hidden{display:none!important}
.auth{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background:radial-gradient(circle at 10% 10%,#7c3aed 0,transparent 30%),radial-gradient(circle at 90% 90%,#2563eb 0,transparent 30%),#090b18}
.auth-card{width:100%;max-width:430px;background:rgba(25,25,30,.94);border:1px solid rgba(255,255,255,.1);border-radius:30px;padding:30px 25px;box-shadow:0 30px 90px rgba(0,0,0,.55)}
.logo{width:85px;height:85px;margin:0 auto 18px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:42px;background:linear-gradient(135deg,#4c1d95,#4f46e5)}
.auth-title{text-align:center;font-size:28px;color:white;font-weight:900}.auth-sub{text-align:center;color:#aaa;margin:8px 0 25px}
.input-group{margin-bottom:15px}.input-group label{display:block;color:#ddd;margin-bottom:7px;font-size:14px}
.input{width:100%;padding:14px 16px;border-radius:15px;border:1px solid #444;background:#202023;color:white;outline:none;font-size:16px}.input:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.main-btn{width:100%;border:0;padding:14px;border-radius:15px;background:linear-gradient(135deg,#6d28d9,#4f46e5);color:white;font-size:17px;font-weight:900;margin-top:5px;transition:.2s}.main-btn:hover{transform:translateY(-2px)}
.outline-btn{width:100%;padding:13px;border-radius:15px;border:1px solid #555;background:transparent;color:white;font-weight:800;margin-top:10px}
.header{position:sticky;top:0;z-index:50;height:70px;background:rgba(255,255,255,.9);backdrop-filter:blur(15px);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.header-brand{display:flex;align-items:center;gap:10px;font-weight:900}.header-logo{width:43px;height:43px;border-radius:13px;background:linear-gradient(135deg,#6d28d9,#4f46e5);display:flex;align-items:center;justify-content:center;color:white;font-size:22px}
.container{max-width:1150px;margin:auto;padding:20px 15px 100px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#111827,#312e81);color:white;border-radius:28px;padding:28px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:white;border:1px solid #e5e7eb;border-radius:21px;padding:18px;box-shadow:0 8px 25px rgba(0,0,0,.04)}.stat-value{font-size:25px;font-weight:900;margin-top:5px}
.bottom-nav{position:fixed;z-index:40;bottom:0;left:0;right:0;height:68px;background:rgba(255,255,255,.94);backdrop-filter:blur(15px);border-top:1px solid #ddd;display:flex;justify-content:center}
.nav-btn{flex:1;max-width:150px;border:0;background:none;color:#777;font-size:20px}.nav-btn span{display:block;font-size:11px;margin-top:2px}.nav-btn.active{color:#6d28d9;font-weight:900}
.card{background:white;border:1px solid #e5e7eb;border-radius:22px;padding:18px;box-shadow:0 7px 25px rgba(0,0,0,.04)}
.categories{display:flex;gap:8px;overflow-x:auto;margin-bottom:15px;padding-bottom:5px}.category{white-space:nowrap;padding:10px 15px;border-radius:13px;border:1px solid #ddd;background:white}.category.active{background:#6d28d9;color:white;border-color:#6d28d9}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.product{background:white;border:1px solid #e5e7eb;border-radius:21px;overflow:hidden;box-shadow:0 7px 22px rgba(0,0,0,.04)}.product.low-stock{border-color:#ef4444}.product-image{height:150px;display:flex;align-items:center;justify-content:center;font-size:55px;background:linear-gradient(135deg,#ede9fe,#e0e7ff)}.product-body{padding:15px}.product-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px}
.small-btn{border:0;border-radius:12px;padding:9px 12px;background:#6d28d9;color:white;font-weight:800}.danger-btn{background:#ef4444}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;text-align:right;border-bottom:1px solid #eee
