<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة أجمل الهدايا</title>
    <!-- استدعاء خط كايرو من جوجل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شاشة الترحيب -->
    <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <div class="loader"></div>
            <h1>مرحبًا يا بشمهندس يوسف</h1>
            <p>جاري تجهيز النظام...</p>
        </div>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-container" class="hidden auth-wrapper">
        <div class="auth-box">
            <div class="logo-placeholder">📚</div>
            <h2>مكتبة أجمل الهدايا</h2>
            <p class="subtitle">بوابة الدخول للنظام</p>
            
            <div class="input-group">
                <input type="email" id="email" placeholder="البريد الإلكتروني" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="كلمة المرور" required>
            </div>
            
            <button id="login-btn" class="primary-btn">تسجيل الدخول</button>
            <button id="register-btn" class="secondary-btn">طلب إنشاء حساب</button>
            
            <p id="auth-message"></p>
        </div>
    </div>

    <!-- لوحة التحكم (الواجهة الرئيسية) -->
    <div id="dashboard" class="hidden dashboard">
        <header class="dashboard-header">
            <div class="header-info">
                <h2>أجمل الهدايا</h2>
                <span class="user-role">لوحة الإدارة</span>
            </div>
            <button id="logout-btn" class="danger-btn">خروج</button>
        </header>
        <div class="modules-grid">
            <div class="module-card">
                <span class="icon">💰</span>
                <h3>الكاشير والبيع</h3>
            </div>
            <div class="module-card">
                <span class="icon">🧾</span>
                <h3>الفواتير</h3>
            </div>
            <div class="module-card">
                <span class="icon">📒</span>
                <h3>الحسابات</h3>
            </div>
            <div class="module-card">
                <span class="icon">📦</span>
                <h3>المخزن</h3>
            </div>
        </div>
    </div>

    <!-- كود الجافاسكريبت -->
    <script type="module" src="app.js"></script>
</body>
</html>
