<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم ماما - 10/10</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #d4af37;
            --light-gold: #ffdf00;
            --dark-bg: #0f0c29;
            --mid-bg: #302b63;
            --light-bg: #24243e;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(212, 175, 55, 0.3);
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg), var(--mid-bg), var(--light-bg));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-light);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* خلفية الجزيئات المتحركة */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* حاوية الشاشات */
        .app-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 600px;
            height: 80vh;
            max-height: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform: translateY(50px) scale(0.9);
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .screen.exit {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-50px) scale(1.1);
        }

        /* التأثير الزجاجي */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            width: 100%;
        }

        /* شاشة الدخول */
        .envelope-wrapper {
            perspective: 1000px;
            margin-bottom: 30px;
        }

        .envelope {
            font-size: 100px;
            animation: floating 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 15px rgba(212, 175, 55, 0.4));
        }

        .title {
            font-family: 'Amiri', serif;
            font-size: 2.5rem;
            color: var(--primary-gold);
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.5);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #cccccc;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            width: 80%;
            margin: 0 auto 20px;
        }

        input[type="password"] {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid var(--glass-border);
            border-radius: 30px;
            color: white;
            text-align: center;
            font-family: 'Cairo', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 5px;
        }

        input[type="password"]:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .btn {
            background: linear-gradient(45deg, var(--primary-gold), var(--light-gold));
            color: #000;
            border: none;
            padding: 12px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
        }

        .error-msg {
            color: #ff6b6b;
            margin-top: 15px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* شاشة الباب السينمائي */
        .door-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .glowing-door {
            width: 100px;
            height: 150px;
            border: 4px solid var(--primary-gold);
            border-radius: 50px 50px 0 0;
            position: relative;
            box-shadow: 0 0 30px var(--primary-gold), inset 0 0 20px var(--primary-gold);
            animation: doorPulse 2s infinite alternate;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .door-light {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 0%;
            background: rgba(255, 223, 0, 0.4);
            animation: lightRise 3s ease-in-out forwards;
        }

        /* شاشة الرسائل */
        .message-container {
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .message-text {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            line-height: 1.8;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            position: absolute;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease;
        }

        .message-text.active-msg {
            opacity: 1;
            transform: translateY(0);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 30px;
            padding: 0 20px;
        }

        .control-btn {
            background: transparent;
            border: 1px solid var(--primary-gold);
            color: var(--primary-gold);
            padding: 8px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s;
        }

        .control-btn:hover:not(:disabled) {
            background: var(--primary-gold);
            color: #000;
        }

        .control-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #666;
            color: #666;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 30px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            background: var(--primary-gold);
            width: 0%;
            transition: width 0.5s ease;
        }

        /* شاشة النهاية */
        .finale-title {
            font-family: 'Amiri', serif;
            font-size: 3rem;
            color: var(--light-gold);
            margin-bottom: 20px;
        }

        .prayer-text {
            font-size: 1.4rem;
            line-height: 1.8;
            color: #eee;
            margin-bottom: 30px;
            font-style: italic;
        }

        .signature-box {
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            padding-top: 20px;
            margin-top: 20px;
        }

        .signature {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            color: #ff9a9e;
        }

        /* الحركات (Animations) */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floating {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        @keyframes doorPulse {
            0% { box-shadow: 0 0 20px var(--primary-gold), inset 0 0 10px var(--primary-gold); }
            100% { box-shadow: 0 0 50px var(--light-gold), inset 0 0 30px var(--light-gold); }
        }

        @keyframes lightRise {
            0% { height: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { height: 100%; opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- خلفية تفاعلية -->
    <canvas id="particleCanvas"></canvas>

    <div class="app-container">
        
        <!-- الشاشة الأولى: الدخول -->
        <div id="screen-login" class="screen active">
            <div class="glass-panel">
                <div class="envelope-wrapper">
                    <div class="envelope">💌</div>
                </div>
                <h1 class="title">عالم ماما</h1>
                <p class="subtitle">في يوم 10/10، افتحي هديتك بكلمة السر الخاصة</p>
                
                <div class="input-group">
                    <input type="password" id="passInput" placeholder="••••" maxlength="4" autocomplete="off">
                </div>
                
                <button class="btn" onclick="verifyPassword()">فتح الهدية</button>
                <p id="errorMsg" class="error-msg">كلمة السر غير صحيحة، جربي (1010)</p>
            </div>
        </div>

        <!-- الشاشة الثانية: الانتقال السينمائي -->
        <div id="screen-door" class="screen">
            <div class="door-container">
                <div class="glowing-door">
                    <div class="door-light"></div>
                </div>
                <h2 class="title" style="font-size: 2rem;">جاري العبور لعالمك...</h2>
            </div>
        </div>

        <!-- الشاشة الثالثة: عرض الرسائل -->
        <div id="screen-messages" class="screen">
            <div class="glass-panel" style="padding: 30px 20px;">
                <h2 style="color: var(--primary-gold); margin-bottom: 20px; font-family: 'Amiri', serif;">رسالة من القلب ❤️</h2>
                
                <div class="message-container" id="msgContainer">
                    <!-- سيتم إدراج الرسائل هنا عبر الجافاسكريبت -->
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

                <div class="controls">
                    <button class="control-btn" id="btnPrev" onclick="navigateMessage(-1)">السابق</button>
                    <button class="control-btn" id="btnNext" onclick="navigateMessage(1)">التالي</button>
                </div>
            </div>
        </div>

        <!-- الشاشة الرابعة: النهاية -->
        <div id="screen-finale" class="screen">
            <div class="glass-panel">
                <h1 class="finale-title">كل سنة وأنتِ طيبة!</h1>
                <p class="prayer-text">
                    "اللهم احفظ أمي وأسعد قلبها، وأطل في عمرها وارزقني برها ورضاها، واجعل أيامها كلها أعياداً وفرحاً لا ينتهي."
                </p>
                <div class="signature-box">
                    <p style="color: #ccc; margin-bottom: 5px;">بكل حُب، من ابنك:</p>
                    <p class="signature">يوسف</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        /* =========================================
           إعدادات النظام والرسائل
        ========================================= */
        const CORRECT_PASSWORD = "1010";
        const messages = [
            "إلى أعظم أم في الوجود، وسبب نور هذه الحياة...",
            "اليوم 10/10 ليس مجرد تاريخ عادي في النتيجة، بل هو اليوم الذي أشرقت فيه الدنيا بوجودك.",
            "أردت هذا العام أن تكون هديتي مختلفة، مساحة هادئة تليق بمقامك في قلبي، لتقرأيها براحة وابتسامة.",
            "مهما كبرت، سأظل مديناً لكِ بكل سهرة، وكل دعوة، وكل لحظة تعب تحملتيها من أجلي.",
            "أنتِ لستِ فقط أمي.. أنتِ سندي الثابت، وصديقتي الأقرب، والبركة التي تحل على كل تفاصيل أيامي.",
            "أتمنى من الله أن يجعل كل أيامك فرحاً وسعادة، وأن يبقيكِ تاجاً من نور فوق رأسي دائماً وأبداً."
        ];
        let currentMsgIndex = 0;

        /* =========================================
           نظام التنقل بين الشاشات
        ========================================= */
        function switchScreen(fromId, toId) {
            const fromScreen = document.getElementById(fromId);
            const toScreen = document.getElementById(toId);
            
            fromScreen.classList.remove('active');
            fromScreen.classList.add('exit');
            
            setTimeout(() => {
                fromScreen.classList.remove('exit');
                toScreen.classList.add('active');
            }, 800); // يتزامن مع مدة انتقال CSS
        }

        function verifyPassword() {
            const input = document.getElementById('passInput').value;
            const error = document.getElementById('errorMsg');
            
            if (input === CORRECT_PASSWORD) {
                error.style.opacity = '0';
                switchScreen('screen-login', 'screen-door');
                
                // تسريع الجزيئات لتبدو كاحتفال
                speedUpParticles();

                // بعد 3 ثواني ننتقل لشاشة الرسائل
                setTimeout(() => {
                    initMessages();
                    switchScreen('screen-door', 'screen-messages');
                }, 3500);
            } else {
                error.style.opacity = '1';
                document.getElementById('passInput').value = '';
                // اهتزاز المربع عند الخطأ
                const panel = document.querySelector('#screen-login .glass-panel');
                panel.style.transform = 'translateX(-10px)';
                setTimeout(() => panel.style.transform = 'translateX(10px)', 100);
                setTimeout(() => panel.style.transform = 'translateX(-10px)', 200);
                setTimeout(() => panel.style.transform = 'translateX(0)', 300);
            }
        }

        // تفعيل زر الإدخال (Enter)
        document.getElementById('passInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyPassword();
        });

        /* =========================================
           نظام عرض الرسائل (بدون تحريك الشاشة)
        ========================================= */
        function initMessages() {
            const container = document.getElementById('msgContainer');
            container.innerHTML = ''; // تفريغ الحاوية

            messages.forEach((msg, index) => {
                const p = document.createElement('p');
                p.className = 'message-text';
                p.id = `msg-${index}`;
                p.innerText = msg;
                container.appendChild(p);
            });

            updateMessageView();
        }

        function navigateMessage(direction) {
            currentMsgIndex += direction;
            
            if (currentMsgIndex >= messages.length) {
                switchScreen('screen-messages', 'screen-finale');
                createFireworks();
                return;
            }
            
            updateMessageView();
        }

        function updateMessageView() {
            // إخفاء الكل وإظهار الحالي فقط
            document.querySelectorAll('.message-text').forEach((el, index) => {
                if (index === currentMsgIndex) {
                    el.classList.add('active-msg');
                } else {
                    el.classList.remove('active-msg');
                }
            });

            // تحديث الأزرار
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            
            btnPrev.disabled = currentMsgIndex === 0;
            
            if (currentMsgIndex === messages.length - 1) {
                btnNext.innerText = "إنهاء 🎁";
            } else {
                btnNext.innerText = "التالي";
            }

            // تحديث شريط التقدم
            const progress = ((currentMsgIndex + 1) / messages.length) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;
        }

        /* =========================================
           نظام الجزيئات (Particles Canvas Engine)
        ========================================= */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let isCelebrating = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height; // البداية العشوائية
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * -1 - 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.type = Math.random() > 0.7 ? 'heart' : 'star';
                this.color = this.type === 'heart' ? `rgba(255, 99, 132, ${this.opacity})` : `rgba(255, 223, 0, ${this.opacity})`;
            }
            update() {
                this.y += isCelebrating ? this.speedY * 3 : this.speedY;
                this.x += this.speedX;
                
                if (this.y < -20) {
                    this.reset();
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                if (this.type === 'star') {
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // رسم قلب صغير
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.scale(this.size * 0.3, this.size * 0.3);
                    ctx.moveTo(0, 0);
                    ctx.bezierCurveTo(0, -3, -5, -3, -5, 0);
                    ctx.bezierCurveTo(-5, 3, 0, 5, 0, 8);
                    ctx.bezierCurveTo(0, 5, 5, 3, 5, 0);
                    ctx.bezierCurveTo(5, -3, 0, -3, 0, 0);
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        function initParticles() {
            for (let i = 0; i < 70; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        function speedUpParticles() {
            isCelebrating = true;
            setTimeout(() => isCelebrating = false, 3000);
        }

        function createFireworks() {
            // زيادة كثافة الجزيئات في النهاية
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle());
            }
            isCelebrating = true;
        }

        // تشغيل الخلفية التفاعلية
        initParticles();
        animateParticles();
    </script>
</body>
</html>
