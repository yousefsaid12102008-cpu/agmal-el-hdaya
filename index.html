<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة أجمل الهدايا</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شاشة الترحيب -->
    <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <h1>مرحبًا يا بشمهندس يوسف</h1>
            <p>جاري تحميل النظام...</p>
        </div>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-container" class="hidden auth-box">
        <h2>تسجيل الدخول للنظام</h2>
        <p class="subtitle">مكتبة أجمل الهدايا</p>
        
        <input type="email" id="email" placeholder="البريد الإلكتروني" required>
        <input type="password" id="password" placeholder="كلمة المرور" required>
        
        <button id="login-btn" class="primary-btn">تسجيل الدخول</button>
        <button id="register-btn" class="secondary-btn">طلب إنشاء حساب</button>
        
        <p id="auth-message"></p>
    </div>

    <!-- لوحة التحكم (الواجهة الرئيسية) -->
    <div id="dashboard" class="hidden dashboard">
        <header class="dashboard-header">
            <h2>لوحة التحكم - أجمل الهدايا</h2>
            <button id="logout-btn" class="danger-btn">تسجيل الخروج</button>
        </header>
        <div class="modules-grid">
            <div class="module-card">الكاشير والبيع 💰</div>
            <div class="module-card">الفواتير 🧾</div>
            <div class="module-card">قسم الحسابات 📒</div>
            <div class="module-card">المخزن 📦</div>
        </div>
    </div>

    <!-- كود الجافاسكريبت (مهم جداً type="module") -->
    <script type="module" src="app.js"></script>
</body>
</html>
